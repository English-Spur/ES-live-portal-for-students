<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Spur - Student Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); padding: 45px 40px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 440px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); text-align: center; position: relative; overflow: hidden; }
        .login-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: linear-gradient(90deg, #38bdf8, #818cf8, #38bdf8); }
        .logo-icon { width: 70px; height: 70px; background: rgba(56, 189, 248, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; border: 1px solid rgba(56, 189, 248, 0.3); font-size: 32px; }
        .brand-title { font-size: 32px; font-weight: 700; color: #38bdf8; letter-spacing: 0.5px; margin-bottom: 5px; }
        .brand-subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 30px; font-weight: 400; }
        .input-group { margin-bottom: 22px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; font-weight: 500; }
        .input-group input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; outline: none; transition: all 0.3s ease; }
        .input-group input:focus { border-color: #38bdf8; box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15); }
        .btn-submit { width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(135deg, #38bdf8, #0284c7); color: #fff; font-weight: 600; font-size: 16px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 10px 20px -5px rgba(56, 189, 248, 0.4); margin-top: 10px; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 15px 25px -5px rgba(56, 189, 248, 0.5); }
        #error-msg { color: #f87171; background: rgba(239, 68, 68, 0.1); padding: 12px; border-radius: 10px; border: 1px solid rgba(239, 68, 68, 0.2); font-size: 13px; margin-top: 20px; display: none; }
        .footer-note { font-size: 12px; color: #64748b; margin-top: 30px; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-icon">🎓</div>
        <h1 class="brand-title">English Spur</h1>
        <p class="brand-subtitle">Empowering Your English Journey</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="studentId">Student ID</label>
                <input type="text" id="studentId" placeholder="Enter your Student ID (e.g. ES101)" required autocomplete="off">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your Password" required>
            </div>
            <button type="submit" class="btn-submit" id="loginBtn">Sign In to Dashboard</button>
        </form>
        <div id="error-msg">⚠️ Invalid Student ID or Password! Please try again.</div>
        <div class="footer-note">© 2026 English Spur. Trusted Learning Platform.</div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBQFPrFI_6FOzlhBOy0wp1-Xb-nDFz5J70",
          authDomain: "english-spur.firebaseapp.com",
          databaseURL: "https://english-spur-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "english-spur",
          storageBucket: "english-spur.firebasestorage.app",
          messagingSenderId: "537883242908",
          appId: "1:537883242908:web:651440b08dda9aa97b9859"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('studentId').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.innerText = "Verifying...";
            loginBtn.disabled = true;

            database.ref('students/' + id).once('value').then((snapshot) => {
                if (snapshot.exists() && snapshot.val().password === pass) {
                    localStorage.setItem('loggedInStudent', JSON.stringify(snapshot.val()));
                    window.location.href = 'dashboard.html';
                } else {
                    errorMsg.style.display = 'block';
                    loginBtn.innerText = "Sign In to Dashboard";
                    loginBtn.disabled = false;
                }
            }).catch((err) => {
                console.error(err);
                errorMsg.innerText = "⚠️ Network error or database connecting...";
                errorMsg.style.display = 'block';
                loginBtn.innerText = "Sign In to Dashboard";
                loginBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
