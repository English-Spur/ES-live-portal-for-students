<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Spur - Student Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; color: #fff; padding: 20px; min-height: 100vh; }
        .container { max-width: 1000px; margin: 0 auto; }
        .navbar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 18px 30px; border-radius: 16px; border: 1px solid #334155; margin-bottom: 30px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
        .brand { font-size: 26px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
        .user-info { display: flex; align-items: center; gap: 20px; }
        .student-name { font-size: 15px; font-weight: 500; color: #e2e8f0; }
        .btn-logout { background: #ef4444; border: none; color: #fff; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .btn-logout:hover { background: #dc2626; transform: translateY(-2px); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; margin-bottom: 25px; }
        .card { background: #1e293b; padding: 28px; border-radius: 20px; border: 1px solid #334155; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); position: relative; }
        .card h2 { color: #38bdf8; font-size: 20px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .welcome-card { background: linear-gradient(135deg, #1e293b, #334155); border-left: 6px solid #38bdf8; margin-bottom: 30px; }
        .class-link-btn { display: inline-block; background: linear-gradient(135deg, #10b981, #059669); color: #fff; text-decoration: none; padding: 14px 28px; border-radius: 12px; font-weight: 600; margin-top: 18px; transition: all 0.3s; box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.4); }
        .class-link-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 20px -3px rgba(16, 185, 129, 0.5); }
        .notice-box { background: #0f172a; padding: 18px; border-radius: 12px; border-left: 4px solid #f59e0b; color: #cbd5e1; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="container">
        <div class="navbar">
            <div class="brand">🎓 English Spur</div>
            <div class="user-info">
                <span id="studentDisplay" class="student-name">Loading Profile...</span>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="card welcome-card">
            <h2 id="welcomeHeader">Welcome back! 👋</h2>
            <p style="color: #94a3b8; font-size: 14px; margin-top: 5px;">Access your live interactive classes, daily study updates, and notices here.</p>
        </div>

        <div class="grid">
            <!-- Live Class Section -->
            <div class="card">
                <h2>🔴 Live Interactive Class</h2>
                <p id="classNotice" style="color: #cbd5e1; font-size: 15px;">Fetching scheduled classes...</p>
                <a id="classUrl" href="#" target="_blank" class="class-link-btn" style="display:none;">🚀 Join Live Class Now</a>
            </div>

            <!-- Announcement Section -->
            <div class="card">
                <h2>📢 Official Announcements</h2>
                <div class="notice-box">
                    <p id="announcementText">No active announcements posted today.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBQFPrFI_6FOzlhBOy0wp1-Xb-nDFz5J70",
          authDomain: "english-spur.firebaseapp.com",
          databaseURL: "https://english-spur-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "english-spur",
          storageBucket: "english-spur.firebasestorage.app",
          messagingSenderId: "537883242908",
          appId: "1:537883242908:web:651440b08dda9aa97b9859"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const student = JSON.parse(localStorage.getItem('loggedInStudent'));
        if (!student) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('studentDisplay').innerText = "ID: " + (student.id || "N/A") + " | " + student.name;
            document.getElementById('welcomeHeader').innerText = "Hello, " + student.name + "! 👋";
        }

        // Real-time listener for Live Class
        database.ref('liveClass').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.url) {
                document.getElementById('classNotice').innerText = "Topic: " + (data.topic || "Scheduled Live Class");
                const urlBtn = document.getElementById('classUrl');
                urlBtn.href = data.url;
                urlBtn.style.display = 'inline-block';
            } else {
                document.getElementById('classNotice').innerText = "No live class is active right now. Stay tuned!";
                document.getElementById('classUrl').style.display = 'none';
            }
        });

        // Real-time listener for Announcements
        database.ref('announcement').on('value', (snapshot) => {
            const text = snapshot.val();
            if (text) {
                document.getElementById('announcementText').innerText = text;
            }
        });

        function logout() {
            localStorage.removeItem('loggedInStudent');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
