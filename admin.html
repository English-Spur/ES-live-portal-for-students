<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Spur - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; color: #fff; padding: 30px 20px; min-height: 100vh; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 20px; margin-bottom: 35px; }
        .brand { font-size: 28px; font-weight: 700; color: #38bdf8; }
        .subtitle { font-size: 13px; color: #94a3b8; margin-top: 4px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; border: 1px solid #334155; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
        .card h2 { color: #38bdf8; font-size: 19px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; font-weight: 500; }
        .input-group input, .input-group textarea { width: 100%; padding: 13px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; outline: none; transition: all 0.3s; }
        .input-group input:focus, .input-group textarea:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
        .btn-action { background: linear-gradient(135deg, #38bdf8, #0284c7); color: #fff; border: none; padding: 13px; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; font-size: 15px; transition: all 0.3s; box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.3); }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 15px 20px -3px rgba(56, 189, 248, 0.4); }
        .status-badge { display: inline-block; background: rgba(16, 185, 129, 0.15); color: #10b981; padding: 6px 12px; border-radius: 20px; font-size: 12px; border: 1px solid rgba(16, 185, 129, 0.3); font-weight: 600; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div>
                <div class="brand">🎓 English Spur Admin Control</div>
                <div class="subtitle">Institute Management Portal (Sovan Kapri)</div>
            </div>
            <div>
                <span class="status-badge">🟢 Firebase Live</span>
            </div>
        </div>

        <div class="grid">
            <!-- Student Add Card -->
            <div class="card">
                <h2>👤 Register Student</h2>
                <form id="addStudentForm">
                    <div class="input-group">
                        <label>Student ID</label>
                        <input type="text" id="newId" placeholder="e.g. ES101" required autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label>Student Name</label>
                        <input type="text" id="newName" placeholder="e.g. Rahul Sen" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="text" id="newPass" placeholder="e.g. 123456" required>
                    </div>
                    <button type="submit" class="btn-action">Save Student Profile</button>
                </form>
            </div>

            <!-- Live Class Update Card -->
            <div class="card">
                <h2>🔴 Set Live Class</h2>
                <form id="liveClassForm">
                    <div class="input-group">
                        <label>Class Topic</label>
                        <input type="text" id="topic" placeholder="e.g. Tense & Fluency Masterclass" required>
                    </div>
                    <div class="input-group">
                        <label>Meeting Link (Google Meet / Zoom)</label>
                        <input type="url" id="classUrl" placeholder="https://meet.google.com/..." required>
                    </div>
                    <button type="submit" class="btn-action">Publish Class Link</button>
                </form>
            </div>

            <!-- Announcement Card -->
            <div class="card">
                <h2>📢 Update Announcement</h2>
                <form id="announcementForm">
                    <div class="input-group">
                        <label>Notice Content</label>
                        <textarea id="noticeText" rows="5" placeholder="Write notice for all students..." required></textarea>
                    </div>
                    <button type="submit" class="btn-action">Publish Notice</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBQFPrFI_6FOzlhBOy0wp1-Xb-nDFz5J70",
          authDomain: "english-spur.firebaseapp.com",
          databaseURL: "https://english-spur-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "english-spur",
          storageBucket: "english-spur.firebasestorage.app",
          messagingSenderId: "537883242908",
          appId: "1:537883242908:web:651440b08dda9aa97b9859"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Register New Student
        document.getElementById('addStudentForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('newId').value.trim();
            const name = document.getElementById('newName').value.trim();
            const pass = document.getElementById('newPass').value.trim();

            database.ref('students/' + id).set({
                id: id,
                name: name,
                password: pass
            }).then(() => {
                alert('Success: Student ' + name + ' (' + id + ') saved successfully!');
                document.getElementById('addStudentForm').reset();
            }).catch((err) => {
                alert('Error saving student: ' + err.message);
            });
        });

        // Publish Live Class
        document.getElementById('liveClassForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const topic = document.getElementById('topic').value.trim();
            const url = document.getElementById('classUrl').value.trim();

            database.ref('liveClass').set({
                topic: topic,
                url: url
            }).then(() => {
                alert('Success: Live Class link published!');
            }).catch((err) => {
                alert('Error publishing class: ' + err.message);
            });
        });

        // Publish Announcement
        document.getElementById('announcementForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const text = document.getElementById('noticeText').value.trim();

            database.ref('announcement').set(text).then(() => {
                alert('Success: Announcement posted!');
            }).catch((err) => {
                alert('Error posting notice: ' + err.message);
            });
        });
    </script>
</body>
</html>
